name: 'the-i18n-kit — Auto-Translate Missing Keys'
description: 'Find missing translation keys and translate them via LLM. Provider-agnostic: supports OpenAI, Anthropic, and Google.'
author: 'Fabian Kirchhoff'

branding:
  icon: 'globe'
  color: 'green'

inputs:
  provider:
    description: 'LLM provider: openai, anthropic, or google'
    required: true
  model:
    description: 'Model name (e.g. gpt-4o, claude-3-5-sonnet-20241022, gemini-2.0-flash)'
    required: true
  api_key:
    description: 'API key for the chosen provider'
    required: true
  layer:
    description: 'Layer name to translate (e.g. common, dashboard)'
    required: true
  locales:
    description: 'Comma-separated target locales (default: all except source)'
    required: false
  source_locale:
    description: 'Reference/source locale (default: project default from .i18n-mcp.json)'
    required: false
  keys:
    description: 'Comma-separated keys to translate (default: all missing)'
    required: false
  batch_size:
    description: 'Keys per LLM call (default: 50)'
    required: false
    default: '50'
  concurrency:
    description: 'Parallel LLM calls (default: provider default)'
    required: false
  dry_run:
    description: 'Preview translations without writing files'
    required: false
    default: 'false'
  working_directory:
    description: 'Project root directory (default: github.workspace)'
    required: false
    default: ${{ github.workspace }}
  commit_message:
    description: 'Commit message (default: "i18n: auto-translate missing keys (<layer>) via <provider> [skip ci]")'
    required: false
  peer_deps:
    description: 'Space-separated npm packages to install (e.g. "@google/genai" for the google provider)'
    required: false
  github_token:
    description: 'GitHub token for posting PR comments. Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}

outputs:
  translated_count:
    description: 'Number of keys translated'
    value: ${{ steps.translate.outputs.translated_count }}
  files_changed:
    description: 'Number of locale files changed'
    value: ${{ steps.push.outputs.files_changed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install the-i18n-cli
      shell: bash
      run: npm install -g the-i18n-cli@latest

    - name: Install peer dependencies
      if: inputs.peer_deps != ''
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: npm install ${{ inputs.peer_deps }}

    - name: Detect i18n config
      id: detect
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: the-i18n-cli detect

    - name: Translate missing keys
      id: translate
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        I18N_API_KEY: ${{ inputs.api_key }}
        I18N_PROVIDER: ${{ inputs.provider }}
      run: |
        set -euo pipefail

        # Route API key to the provider-specific env var
        case "$I18N_PROVIDER" in
          openai)   export OPENAI_API_KEY="$I18N_API_KEY" ;;
          anthropic) export ANTHROPIC_API_KEY="$I18N_API_KEY" ;;
          google)   export GEMINI_API_KEY="$I18N_API_KEY" ;;
          *)        echo "::error::Unknown provider: $I18N_PROVIDER"; exit 1 ;;
        esac

        args=(
          --provider "${{ inputs.provider }}"
          --model "${{ inputs.model }}"
          --layer "${{ inputs.layer }}"
          --batch-size "${{ inputs.batch_size }}"
          --json
        )

        [ -n "${{ inputs.locales }}" ]       && args+=(--targets "${{ inputs.locales }}")
        [ -n "${{ inputs.source_locale }}" ] && args+=(--ref "${{ inputs.source_locale }}")
        [ -n "${{ inputs.keys }}" ]          && args+=(--keys "${{ inputs.keys }}")
        [ -n "${{ inputs.concurrency }}" ]   && args+=(--concurrency "${{ inputs.concurrency }}")
        [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)

        mkdir -p .i18n-reports
        output=$(the-i18n-cli translate "${args[@]}")
        echo "$output" | tee .i18n-reports/translate-output.json

        count=$(echo "$output" | jq -r '.translated // .totalTranslated // 0')
        echo "translated_count=$count" >> "$GITHUB_OUTPUT"

    - name: Push translations
      id: push
      if: inputs.dry_run == 'false'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        COMMIT_MSG: ${{ inputs.commit_message }}
        PROVIDER: ${{ inputs.provider }}
        LAYER: ${{ inputs.layer }}
        MODEL: ${{ inputs.model }}
        TRANSLATED_COUNT: ${{ steps.translate.outputs.translated_count }}
      run: |
        set -euo pipefail

        if git diff --quiet && git diff --cached --quiet; then
          echo "No translation changes to commit."
          echo "files_changed=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if [ -n "${COMMIT_MSG:-}" ]; then
          MSG="$COMMIT_MSG"
        else
          MSG="i18n: auto-translate missing keys (${LAYER}) via ${PROVIDER} [skip ci]"
        fi

        git add .
        git commit -m "$MSG"
        git push origin HEAD

        CHANGED_FILES=$(git diff --name-only "HEAD~1" | wc -l | tr -d ' ')
        echo "files_changed=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

        # Post PR comment (only in pull_request context)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          gh pr comment "${{ github.event.pull_request.number }}" --body "## i18n Auto-Translate 🌐

        Auto-translated missing keys from source locale to target locales.

        | | |
        |---|---|
        | Provider | ${PROVIDER} |
        | Model | ${MODEL} |
        | Layer | ${LAYER} |
        | Keys translated | ${TRANSLATED_COUNT} |
        | Files changed | ${CHANGED_FILES} |

        Translations pushed to this branch."
        fi

        echo "Pushed ${CHANGED_FILES} locale file(s)."

    - name: Dry run summary
      if: inputs.dry_run == 'true'
      shell: bash
      run: |
        echo "::notice::Dry run complete. ${{ steps.translate.outputs.translated_count }} keys would be translated."
