name: 'the-i18n-kit — Auto-Translate Missing Keys'
description: 'Find missing translation keys and translate them via LLM. Provider-agnostic: supports OpenAI, Anthropic, and Google.'
author: 'Fabian Kirchhoff'

branding:
  icon: 'globe'
  color: 'green'

inputs:
  provider:
    description: 'LLM provider: openai, anthropic, or google'
    required: true
  model:
    description: 'Model name (e.g. gpt-4o, claude-3-5-sonnet-20241022, gemini-2.0-flash)'
    required: true
  api_key:
    description: 'API key for the chosen provider. Passed to the step under the provider''s own environment variable name.'
    required: true
  layer:
    description: 'Layer name to translate (e.g. common, dashboard)'
    required: true
  locales:
    description: 'Comma-separated target locales (default: all except source)'
    required: false
  source_locale:
    description: 'Reference/source locale (default: project default from .i18n-mcp.json)'
    required: false
  keys:
    description: 'Comma-separated keys to translate (default: all missing)'
    required: false
  batch_size:
    description: 'Keys per LLM call (default: 50)'
    required: false
    default: '50'
  dry_run:
    description: 'Preview translations without writing files'
    required: false
    default: 'false'
  fail_on_failed:
    description: 'Fail the step (exit 2) when any key failed to translate. Off by default: a partly failed run still writes what succeeded, and the failed keys stay missing for the next run to retry.'
    required: false
    default: 'false'
  working_directory:
    description: 'Project root directory (default: github.workspace)'
    required: false
    default: ${{ github.workspace }}
  cli_version:
    description: '@the-i18n-kit/cli version to install (npm dist-tag or version). Use "skip" if the CLI is already installed (e.g. a local build).'
    required: false
    default: '8' # x-release-please-major

outputs:
  translated_count:
    description: 'Number of keys translated, or of keys that would be translated on a dry run'
    value: ${{ steps.translate.outputs.translated_count }}
  failed_count:
    description: 'Number of keys that failed to translate'
    value: ${{ steps.translate.outputs.failed_count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install @the-i18n-kit/cli
      if: inputs.cli_version != 'skip'
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
      run: npm install -g "@the-i18n-kit/cli@${CLI_VERSION}"

    - name: Translate missing keys
      id: translate
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        # The CLI resolves the key from the env var of the provider it was
        # asked for, so all three carry the same input and only one is read.
        OPENAI_API_KEY: ${{ inputs.api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.api_key }}
        GEMINI_API_KEY: ${{ inputs.api_key }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        LAYER: ${{ inputs.layer }}
        BATCH_SIZE: ${{ inputs.batch_size }}
        LOCALES: ${{ inputs.locales }}
        SOURCE_LOCALE: ${{ inputs.source_locale }}
        KEYS: ${{ inputs.keys }}
        DRY_RUN: ${{ inputs.dry_run }}
        FAIL_ON_FAILED: ${{ inputs.fail_on_failed }}
      run: |
        set -euo pipefail

        args=(--provider "$PROVIDER" --model "$MODEL" --layer "$LAYER" --batch-size "$BATCH_SIZE" --json)
        [ -z "$LOCALES" ] || args+=(--targetLocales "$LOCALES")
        [ -z "$SOURCE_LOCALE" ] || args+=(--referenceLocale "$SOURCE_LOCALE")
        [ -z "$KEYS" ] || args+=(--keys "$KEYS")
        [ "$DRY_RUN" != "true" ] || args+=(--dry-run)
        [ "$FAIL_ON_FAILED" != "true" ] || args+=(--fail-on-failed)

        # The CLI owns the pass/fail decision and reports it as an exit code:
        # 0 success, 1 the run itself failed, 2 a requested gate tripped. The
        # counts below feed the step outputs and never a decision.
        result="${RUNNER_TEMP}/i18n-translate.json"
        set +e
        the-i18n-cli translate "${args[@]}" | tee "$result"
        status=${PIPESTATUS[0]}
        set -e

        jq -r '"translated_count=\((.summary.totalTranslated // 0) + (.summary.totalWouldTranslate // 0))",
               "failed_count=\(.summary.totalFailed // 0)"' "$result" >> "$GITHUB_OUTPUT" || true

        [ "$status" -ne 1 ] || echo "::error::translate failed (exit 1) — check provider, model, and API key."
        exit "$status"
