# the-i18n-kit — GitLab CI template
#
# Provides two reusable jobs:
#   .i18n-translate  – find missing keys and auto-translate via LLM
#   .i18n-cleanup    – find orphan keys and report findings on the MR
#
# Usage in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/fabkho/the-i18n-kit/main/gitlab-ci.yml'
#
#   i18n-translate:
#     extends: .i18n-translate
#     variables:
#       I18N_PROVIDER: google
#       I18N_MODEL: gemini-2.0-flash
#       I18N_API_KEY: $GEMINI_API_KEY
#       I18N_LAYER: common
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - i18n/locales/en.json
#
#   i18n-cleanup:
#     extends: .i18n-cleanup
#     variables:
#       I18N_LAYER: root
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - components/**/*.vue
#           - i18n/locales/*.json

# ─── Base image used by both jobs ────────────────────────────────────────────
.i18n-base:
  image: node:22-alpine

# ─── Translate missing keys ──────────────────────────────────────────────────
.i18n-translate:
  extends: .i18n-base
  stage: lint
  allow_failure: true
  variables:
    # Required
    I18N_PROVIDER: ""         # openai | anthropic | google
    I18N_MODEL: ""            # e.g. gpt-4o, gemini-2.0-flash
    I18N_API_KEY: ""          # API key for the chosen provider
    I18N_LAYER: ""            # e.g. common, dashboard

    # Optional — translation
    I18N_LOCALES: ""          # comma-separated target locales (default: all except source)
    I18N_SOURCE_LOCALE: ""    # reference locale (default: from .i18n-mcp.json)
    I18N_KEYS: ""             # comma-separated keys (default: all missing)
    I18N_BATCH_SIZE: "50"     # keys per LLM call
    I18N_CONCURRENCY: ""      # parallel LLM calls (default: provider default)
    I18N_DRY_RUN: "false"     # preview without writing files

    # Optional — dependencies
    I18N_INSTALL_PEER_DEPS: ""  # space-separated npm packages to install (e.g. "@google/genai")

    # Optional — PR behaviour
    I18N_COMMIT_MESSAGE: ""   # custom commit message
    I18N_MR_COMMENT: "true"   # post a summary comment on the MR

  before_script:
    - npm install -g the-i18n-cli@latest
    - |
      if [ -n "$I18N_INSTALL_PEER_DEPS" ]; then
        echo "Installing peer dependencies: $I18N_INSTALL_PEER_DEPS"
        npm install $I18N_INSTALL_PEER_DEPS
      fi
    - the-i18n-cli detect

  script:
    - |
      set -euo pipefail

      # Route API key to provider-specific env var
      case "$I18N_PROVIDER" in
        openai)    export OPENAI_API_KEY="$I18N_API_KEY" ;;
        anthropic) export ANTHROPIC_API_KEY="$I18N_API_KEY" ;;
        google)    export GEMINI_API_KEY="$I18N_API_KEY" ;;
        *)
          echo "ERROR: Unknown provider: $I18N_PROVIDER"
          echo "Must be one of: openai, anthropic, google"
          exit 1
          ;;
      esac

      if [ -z "$I18N_PROVIDER" ] || [ -z "$I18N_MODEL" ] || [ -z "$I18N_API_KEY" ] || [ -z "$I18N_LAYER" ]; then
        echo "ERROR: I18N_PROVIDER, I18N_MODEL, I18N_API_KEY, and I18N_LAYER are required"
        exit 1
      fi

      args=(
        --provider "$I18N_PROVIDER"
        --model "$I18N_MODEL"
        --layer "$I18N_LAYER"
        --batch-size "$I18N_BATCH_SIZE"
        --json
      )

      [ -n "$I18N_LOCALES" ]       && args+=(--targets "$I18N_LOCALES")
      [ -n "$I18N_SOURCE_LOCALE" ] && args+=(--ref "$I18N_SOURCE_LOCALE")
      [ -n "$I18N_KEYS" ]          && args+=(--keys "$I18N_KEYS")
      [ -n "$I18N_CONCURRENCY" ]   && args+=(--concurrency "$I18N_CONCURRENCY")
      [ "$I18N_DRY_RUN" = "true" ] && args+=(--dry-run)

      mkdir -p .i18n-reports
      the-i18n-cli translate "${args[@]}" | tee .i18n-reports/translate-output.json

  after_script:
    - |
      set -euo pipefail

      if [ "$I18N_DRY_RUN" = "true" ]; then
        echo "Dry run complete. No files written."
        exit 0
      fi

      # Check if there are changes
      if git diff --quiet && git diff --cached --quiet; then
        echo "No translation changes to commit."
        exit 0
      fi

      # Configure git and push to the triggering branch
      git config user.name "i18n CI"
      git config user.email "ci@the-i18n-kit.dev"

      if [ -n "${I18N_COMMIT_MESSAGE:-}" ]; then
        COMMIT_MSG="$I18N_COMMIT_MESSAGE"
      else
        COMMIT_MSG="i18n: auto-translate missing keys ($I18N_LAYER) via $I18N_PROVIDER [skip ci]"
      fi

      PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git add i18n/locales/
      git commit -m "$COMMIT_MSG"
      git push "$PUSH_URL" "HEAD:${CI_COMMIT_REF_NAME}"

      CHANGED_FILES=$(git diff --name-only "HEAD~1" i18n/locales/ | wc -l | tr -d ' ')

      # Post MR comment (only in MR context)
      if [ "$I18N_MR_COMMENT" = "true" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{
            \"body\": \"## i18n Auto-Translate 🌐\n\nAuto-translated missing keys from source locale to target locales.\n\n| | |\n|---|---|\n| Provider | ${I18N_PROVIDER} |\n| Model | ${I18N_MODEL} |\n| Layer | ${I18N_LAYER} |\n| Files changed | ${CHANGED_FILES} |\n\nTranslations pushed to this branch.\"}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      fi

      echo "Pushed ${CHANGED_FILES} locale file(s) to ${CI_COMMIT_REF_NAME}"

# ─── Find orphan keys ───────────────────────────────────────────────────────
.i18n-cleanup:
  extends: .i18n-base
  stage: lint
  allow_failure: true
  variables:
    # Required
    I18N_LAYER: ""            # e.g. root, common

    # Optional
    I18N_INSTALL_PEER_DEPS: ""

  before_script:
    - apk add --no-cache jq
    - npm install -g the-i18n-cli@latest
    - |
      if [ -n "$I18N_INSTALL_PEER_DEPS" ]; then
        npm install $I18N_INSTALL_PEER_DEPS
      fi
    - the-i18n-cli detect

  script:
    - |
      set -euo pipefail

      mkdir -p .i18n-reports

      npx the-i18n-cli orphans \
        --layer "$I18N_LAYER" \
        --json \
        > .i18n-reports/orphans.json

      ORPHAN_COUNT=$(jq '.summary.totalOrphans // 0' .i18n-reports/orphans.json)

      if [ "$ORPHAN_COUNT" -eq 0 ]; then
        COMMENT="## i18n Cleanup ✅

      No orphan keys found in layer \`${I18N_LAYER}\`. All translation keys are referenced in source code."
      else
        ORPHAN_LIST=$(jq -r '[.orphanKeys[] | "- \`\(.key)\`"] | join("\n")' .i18n-reports/orphans.json)
        COMMENT="## i18n Cleanup ⚠️

      **${ORPHAN_COUNT} orphan key(s) found** in layer \`${I18N_LAYER}\` — keys in locale files with no source code references.

      <details><summary>Click to expand</summary>

      ${ORPHAN_LIST}

      </details>

      > ⚠️ Do not blindly delete all orphans. Some may be dynamically constructed. Review manually.
      > Full report: [job artifacts](${CI_JOB_URL}/artifacts/browse/.i18n-reports/)"
      fi

      # Print summary to job log
      echo ""
      echo "============================================"
      echo "  i18n Cleanup Report — layer: ${I18N_LAYER}"
      echo "  Orphan keys found: ${ORPHAN_COUNT}"
      echo "============================================"

      # Post MR comment (only in MR context)
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(echo "$COMMENT" | jq -Rs '{body: .}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      fi

  artifacts:
    paths:
      - .i18n-reports/orphans.json
    expire_in: 7 days
    when: always
