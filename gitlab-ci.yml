# the-i18n-kit — GitLab CI template
#
# Provides two reusable jobs:
#   .i18n-translate  – find missing keys and auto-translate via LLM
#   .i18n-cleanup    – find orphan keys and report findings on the MR
#
# Usage in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/fabkho/the-i18n-kit/main/gitlab-ci.yml'
#
#   i18n-translate:
#     extends: .i18n-translate
#     variables:
#       I18N_PROVIDER: google
#       I18N_MODEL: gemini-2.5-flash
#       I18N_API_KEY: $GEMINI_API_KEY
#       I18N_LAYER: common
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - i18n/locales/en.json
#
#   i18n-cleanup:
#     extends: .i18n-cleanup
#     variables:
#       I18N_LAYER: root
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - components/**/*.vue
#           - i18n/locales/*.json
#
# Pushing translations back to the branch requires ONE of:
#   a) Project setting: Settings → CI/CD → Job token permissions →
#      "Allow Git push requests to the repository" (GitLab ≥ 17.2).
#      Then the default CI_JOB_TOKEN push just works.
#   b) A project access token with `write_repository` + `api` scope in the
#      I18N_PUSH_TOKEN CI variable (also used to post MR comments).
# MR comments always require I18N_PUSH_TOKEN (a job token cannot call the
# notes API) — without it, comment posting is skipped with a warning.

# ─── Base image used by both jobs ────────────────────────────────────────────
.i18n-base:
  image: node:22-alpine

# ─── Translate missing keys ──────────────────────────────────────────────────
.i18n-translate:
  extends: .i18n-base
  stage: lint
  allow_failure: true
  variables:
    # Optional — translation
    I18N_LOCALES: ""          # comma-separated target locales (default: all except source)
    I18N_SOURCE_LOCALE: ""    # reference locale (default: from .i18n-mcp.json)
    I18N_KEYS: ""             # comma-separated keys (default: all missing)
    I18N_BATCH_SIZE: "50"     # keys per LLM call
    I18N_DRY_RUN: "false"     # preview without writing files

    # Optional — dependencies
    I18N_CLI_VERSION: "latest"  # pin the-i18n-cli (npm version or dist-tag)
    I18N_INSTALL_PEER_DEPS: ""  # extra npm packages to install globally alongside the CLI

    # Optional — push/MR behaviour
    I18N_PUSH_TOKEN: ""       # project access token (write_repository + api). See header comment.
    I18N_LOCALE_PATHS: "i18n/locales/"  # space-separated globs for locale directories (e.g. "i18n/locales/ app-*/i18n/locales/")
    I18N_COMMIT_MESSAGE: ""   # custom commit message (include [skip ci] to avoid pipeline loops)
    I18N_MR_COMMENT: "true"   # post a summary comment on the MR (requires I18N_PUSH_TOKEN)

  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache git curl jq; fi
    - |
      # Install the CLI plus the SDK for the chosen provider (optional peer dep)
      case "${I18N_PROVIDER:-}" in
        openai)    SDK="openai" ;;
        anthropic) SDK="@anthropic-ai/sdk" ;;
        google)    SDK="@google/genai" ;;
        *)         SDK="" ;;
      esac
      # --legacy-peer-deps: openai@5 declares peerOptional zod@^3, the CLI uses zod@^4
      npm install -g --legacy-peer-deps "the-i18n-cli@${I18N_CLI_VERSION}" $SDK $I18N_INSTALL_PEER_DEPS

  script:
    - |
      set -euo pipefail

      MISSING=""
      [ -z "${I18N_PROVIDER:-}" ] && MISSING="$MISSING I18N_PROVIDER"
      [ -z "${I18N_MODEL:-}" ]    && MISSING="$MISSING I18N_MODEL"
      [ -z "${I18N_API_KEY:-}" ]  && MISSING="$MISSING I18N_API_KEY"
      [ -z "${I18N_LAYER:-}" ]    && MISSING="$MISSING I18N_LAYER"
      if [ -n "$MISSING" ]; then
        echo "ERROR: missing required variables:$MISSING"
        exit 1
      fi

      # Route API key to provider-specific env var
      case "$I18N_PROVIDER" in
        openai)    export OPENAI_API_KEY="$I18N_API_KEY" ;;
        anthropic) export ANTHROPIC_API_KEY="$I18N_API_KEY" ;;
        google)    export GEMINI_API_KEY="$I18N_API_KEY" ;;
        *)
          echo "ERROR: Unknown provider: $I18N_PROVIDER"
          echo "Must be one of: openai, anthropic, google"
          exit 1
          ;;
      esac

      args="--provider $I18N_PROVIDER --model $I18N_MODEL --layer $I18N_LAYER --batch-size $I18N_BATCH_SIZE"

      [ -n "$I18N_LOCALES" ]       && args="$args --targets $I18N_LOCALES"
      [ -n "$I18N_SOURCE_LOCALE" ] && args="$args --ref $I18N_SOURCE_LOCALE"
      [ -n "$I18N_KEYS" ]          && args="$args --keys $I18N_KEYS"
      [ "$I18N_DRY_RUN" = "true" ] && args="$args --dry-run"

      mkdir -p .i18n-reports
      the-i18n-cli translate $args | tee .i18n-reports/translate-output.json

      # Tolerant parse: older CLI versions (< 1.5.4) mixed logs into stdout.
      # Dry runs report their counts as totalWouldTranslate.
      TRANSLATED=$(jq -r '(.summary.totalTranslated // 0) + (.summary.totalWouldTranslate // 0)' .i18n-reports/translate-output.json 2>/dev/null || echo "?")
      FAILED=$(jq -r '.summary.totalFailed // 0' .i18n-reports/translate-output.json 2>/dev/null || echo "?")
      echo "Translated: $TRANSLATED, failed: $FAILED"
      if [ "$FAILED" != "?" ] && [ "$FAILED" -gt 0 ] && [ "$TRANSLATED" = "0" ]; then
        echo "ERROR: all $FAILED keys failed to translate — check provider, model, and API key."
        exit 1
      fi

      if [ "$I18N_DRY_RUN" = "true" ]; then
        echo "Dry run complete. No files written."
        exit 0
      fi

      # Check if there are locale file changes (configurable path pattern)
      if git diff --quiet -- $I18N_LOCALE_PATHS && git diff --cached --quiet -- $I18N_LOCALE_PATHS; then
        echo "No translation changes to commit."
        exit 0
      fi

      CHANGED_FILES=$(git status --porcelain -- $I18N_LOCALE_PATHS | wc -l | tr -d ' ')

      # Configure git and push to the triggering branch.
      # Runs in `script` (not after_script) so a failed push fails the job.
      git config user.name "${GITLAB_USER_NAME:-i18n CI}"
      git config user.email "${GITLAB_USER_EMAIL:-ci@the-i18n-kit.dev}"

      if [ -n "${I18N_COMMIT_MESSAGE:-}" ]; then
        COMMIT_MSG="$I18N_COMMIT_MESSAGE"
      else
        COMMIT_MSG="i18n: auto-translate missing keys ($I18N_LAYER) via $I18N_PROVIDER [skip ci]"
      fi

      if [ -n "${I18N_PUSH_TOKEN:-}" ]; then
        PUSH_URL="https://oauth2:${I18N_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi

      git add $I18N_LOCALE_PATHS
      git commit -m "$COMMIT_MSG"
      if ! git push "$PUSH_URL" "HEAD:${CI_COMMIT_REF_NAME}"; then
        echo "ERROR: git push failed."
        if [ -z "${I18N_PUSH_TOKEN:-}" ]; then
          echo "The default CI_JOB_TOKEN can only push when the project allows it:"
          echo "  Settings → CI/CD → Job token permissions → 'Allow Git push requests to the repository'"
          echo "Alternatively set I18N_PUSH_TOKEN to a project access token with write_repository scope."
        fi
        exit 1
      fi

      echo "Pushed ${CHANGED_FILES} locale file(s) to ${CI_COMMIT_REF_NAME}"

      # Post MR comment (only in MR context; requires an API-capable token)
      if [ "$I18N_MR_COMMENT" = "true" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        if [ -z "${I18N_PUSH_TOKEN:-}" ]; then
          echo "WARNING: skipping MR comment — set I18N_PUSH_TOKEN (api scope) to enable it."
        else
          BODY="## i18n Auto-Translate 🌐\n\nAuto-translated missing keys from source locale to target locales.\n\n| | |\n|---|---|\n| Provider | ${I18N_PROVIDER} |\n| Model | ${I18N_MODEL} |\n| Layer | ${I18N_LAYER} |\n| Keys translated | ${TRANSLATED} |\n| Files changed | ${CHANGED_FILES} |\n\nTranslations pushed to this branch."
          curl --fail --silent --show-error --request POST \
            --header "PRIVATE-TOKEN: ${I18N_PUSH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": \"${BODY}\"}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
            || echo "WARNING: failed to post MR comment."
        fi
      fi

  artifacts:
    paths:
      - .i18n-reports/translate-output.json
    expire_in: 7 days
    when: always

# ─── Find orphan keys ───────────────────────────────────────────────────────
.i18n-cleanup:
  extends: .i18n-base
  stage: lint
  allow_failure: true
  variables:
    # Required
    I18N_LAYER: ""            # e.g. root, common

    # Optional
    I18N_CLI_VERSION: "latest"
    I18N_INSTALL_PEER_DEPS: ""
    I18N_PUSH_TOKEN: ""       # project access token (api scope) for MR comments

  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache git curl jq; fi
    - npm install -g --legacy-peer-deps "the-i18n-cli@${I18N_CLI_VERSION}" $I18N_INSTALL_PEER_DEPS

  script:
    - |
      set -euo pipefail

      mkdir -p .i18n-reports

      # remove-orphans is a dry run by default — it only reports
      the-i18n-cli remove-orphans \
        --layer "$I18N_LAYER" \
        > .i18n-reports/orphans.json

      ORPHAN_COUNT=$(jq '.summary.orphanCount // 0' .i18n-reports/orphans.json)

      if [ "$ORPHAN_COUNT" -eq 0 ]; then
        COMMENT="## i18n Cleanup ✅

      No orphan keys found in layer \`${I18N_LAYER}\`. All translation keys are referenced in source code."
      else
        ORPHAN_LIST=$(jq -r '[.orphanKeys | to_entries[] | .value[] | "- `\(.)`"] | join("\n")' .i18n-reports/orphans.json)
        COMMENT="## i18n Cleanup ⚠️

      **${ORPHAN_COUNT} orphan key(s) found** in layer \`${I18N_LAYER}\` — keys in locale files with no source code references.

      <details><summary>Click to expand</summary>

      ${ORPHAN_LIST}

      </details>

      > ⚠️ Do not blindly delete all orphans. Some may be dynamically constructed. Review manually.
      > Full report: [job artifacts](${CI_JOB_URL}/artifacts/browse/.i18n-reports/)"
      fi

      # Print summary to job log
      echo ""
      echo "============================================"
      echo "  i18n Cleanup Report — layer: ${I18N_LAYER}"
      echo "  Orphan keys found: ${ORPHAN_COUNT}"
      echo "============================================"

      # Post MR comment (only in MR context; requires an API-capable token)
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        if [ -z "${I18N_PUSH_TOKEN:-}" ]; then
          echo "WARNING: skipping MR comment — set I18N_PUSH_TOKEN (api scope) to enable it."
        else
          curl --fail --silent --show-error --request POST \
            --header "PRIVATE-TOKEN: ${I18N_PUSH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(echo "$COMMENT" | jq -Rs '{body: .}')" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
            || echo "WARNING: failed to post MR comment."
        fi
      fi

  artifacts:
    paths:
      - .i18n-reports/orphans.json
    expire_in: 7 days
    when: always
